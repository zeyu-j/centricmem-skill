# managed by centricmem-skill: installed into goose's recipe library on session start; local edits are overwritten.
version: "1.0.0"
title: CentricMem preflight
description: >
  Check this host's CentricMem connection over MCP and pull the session-start memory block.
  Read-only: it writes no cards and never touches a local hub. Built for guests, including hosts
  wired by OAuth, where there is no Bearer and the centricmem CLI cannot be used at all.
instructions: |
  You are checking CentricMem for this machine. Use only the CentricMem MCP tools (cm_health,
  cm_doctor, cm_ambient). Do not shell out, do not curl, do not create a hub or a local workspace,
  do not rotate or paste a key, and do not write memory cards in this recipe.

  1. cm_health - report the mode and the cli / skill_latest versions.
  2. cm_doctor - report librarian reachability, whether this host holds a usable key, and Skill status.
  3. cm_ambient - pass shelf={{ shelf }} when it is not empty, otherwise omit it entirely (an
     empty value means "use the machine default"). Print the returned block unchanged.
  4. If a call fails, name the call and quote the error text. Do not retry more than once. If the
     failure is "no key on this machine" on a host that connects by OAuth, say plainly that this is
     expected and that cm_* over MCP is the working path - the CLI is not.
  5. Finish with one line: OK, or the single blocking problem.
prompt: |
  Run the CentricMem preflight for this host{{#if shelf}} (shelf: {{ shelf }}){{/if}} and report the result.
parameters:
  - key: shelf
    input_type: string
    requirement: optional
    default: ""
    description: "Shelf id to read the ambient block for (omit for the machine default)"
activities:
  - "CentricMem preflight"
  - "Check my CentricMem connection"
