name: History leak check

# check-public.py scans the working tree. This scans what a reader can recover from the repository itself,
# which is how the private host names and the pre-trim Skill copies stayed visible after the tree was
# cleaned. Inline rather than in scripts/ because the usage-only rule forbids that directory here.
#
# Two things this gate has to get right, both learned by getting them wrong:
#
# 1. It must not name what it looks for, or the commit that adds it counts as a leak. Patterns are base64,
#    decoded at run time.
# 2. It must ignore the two scanner files themselves. check-public.py has to list the private names to do
#    its job, so a scan of history will always find them there - a gate that flags its own tooling is a
#    gate nobody will trust. What this measures is exposure in content, not in a pattern list.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for private names
        run: |
          set -e
          failed=0
          PATTERNS=$(printf '%s\n' cmVhc29uaXg= aWNlZ3JlZW4= Yzpcc3JjXGNlbnRyaWNtZW0= ZDpcY2VudHJpY21lbQ== ZTpcY2VudHJpY21lbQ== | while read -r b; do echo "$b" | base64 -d; echo; done)
          for p in $PATTERNS; do
            n=$(git log --all -i -S "$p" --oneline -- . \
                  ':(exclude).github/workflows/check-public.py' \
                  ':(exclude).github/workflows/check-history.yml' | wc -l | tr -d ' ')
            if [ "$n" != "0" ]; then
              echo "history leak: '$p' appears in $n commit(s)"
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            echo "This is what check-public.py cannot see. Rewrite the history, or do not publish the name."
            exit 1
          fi
          echo "ok history clean"
