name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public repo is usage-only
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -f plugin.json
          test -f mcp.json
          test -f .codex-plugin/plugin.json
          test -f .claude-plugin/marketplace.json
          test -f .claude-plugin/plugin.json
          test -f .cursor-plugin/marketplace.json
          test -f .cursor-plugin/plugin.json
          test -f .codebuddy-plugin/marketplace.json
          test -f .codebuddy-plugin/plugin.json
          test -f .workbuddy-plugin/marketplace.json
          test -f .workbuddy-plugin/plugin.json
          test -f .kimi-plugin/plugin.json
          test -f .kimi-plugin/marketplace.json
          test -f .kiro/plugins/marketplace.json
          test -f .agents/plugins/marketplace.json
          test -f .github/plugin/marketplace.json
          test -f .github/workflows/hol-plugin-scanner.yml
          test -f .codexignore
          test -f skills/centricmem-agent/SKILL.md
          test -f skills/centricmem-agent/REFERENCE.md
          python3 .github/workflows/check-public.py
          if [ -d src ] || [ -d dist ] || [ -d tests ] || [ -d desktop ] || [ -d web ]; then
            echo "client trees must not ship" >&2
            exit 1
          fi
          if [ -f PRODUCT.md ] || [ -f ARCHITECTURE.md ] || [ -f BETA.md ]; then
            echo "design/operator docs must not ship" >&2
            exit 1
          fi
          if [ -d skills/academic-db-agent ] || [ -d skills/centricmem-agent/integrations ] || [ -f skills/centricmem-agent/ACADEMIC.md ]; then
            echo "private skill extras must not ship" >&2
            exit 1
          fi

      - name: goose manifest is the one goose can parse
        run: |
          set -euo pipefail
          test -f .goose-plugin/plugin.json
          # goose's plugin MCP parser is stdio-only, so a remote (http) entry aborts the whole install
          # with `missing field command`. The root manifest may declare one; this manifest may not.
          if grep -q '"mcpServers"' .goose-plugin/plugin.json; then
            echo "mcpServers in .goose-plugin/plugin.json makes goose unable to install the plugin" >&2
            exit 1
          fi

      - name: hooks resolve their plugin root on goose too
        run: |
          set -euo pipefail
          # goose substitutes ${PLUGIN_ROOT} and knows nothing about ${CLAUDE_PLUGIN_ROOT}, which would
          # expand to nothing and fail the hook - silently, because hook failures are fail-open.
          grep -qF '${CLAUDE_PLUGIN_ROOT:-$PLUGIN_ROOT}' hooks/hooks.json
          # Count rather than pattern-match a trailing character: a bare ${CLAUDE_PLUGIN_ROOT} at the end
          # of a line has nothing after it for a `[^:]` test to find, which is how the first version of
          # this check missed exactly the case it was written for.
          # Match the prefix, not the closed token: in the portable form the character after ROOT is ":",
          # so searching for a closing brace finds only the bare ones and the comparison fails on a
          # correct file. Counting the prefix is what makes the two numbers comparable.
          total=$(grep -o '\${CLAUDE_PLUGIN_ROOT' hooks/hooks.json | wc -l | tr -d ' ')
          portable=$(grep -o '\${CLAUDE_PLUGIN_ROOT:-' hooks/hooks.json | wc -l | tr -d ' ')
          if [ "$total" -ne "$portable" ]; then
            echo "a bare \${CLAUDE_PLUGIN_ROOT} is in hooks/hooks.json: goose would expand it to nothing" >&2
            exit 1
          fi

      - name: manifest versions agree
        run: node tools/check-versions.mjs
